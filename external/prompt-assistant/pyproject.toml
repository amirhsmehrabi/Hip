[project]
name = "prompt-assistant"
version = "0.1.0"
description = "Remiqora's prompt assistant: a local language model that turns an idea into an engine's prompt (RFC 0002)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  # The same torch as sa3-server: uv links it from its cache instead of downloading it again.
  "torch==2.7.1",
  # Qwen3.5 (qwen3_5) needs transformers 5.x.
  "transformers==5.20.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "huggingface-hub>=1.7",
]

[project.scripts]
prompt-assistant = "prompt_assistant.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prompt_assistant"]

# CUDA builds of torch: plain PyPI ships CPU-only wheels on Windows.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
