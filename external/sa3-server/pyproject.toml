[project]
name = "sa3-server"
version = "0.1.0"
description = "Remiqora's HTTP server around Stable Audio 3 (text-to-audio, audio-to-audio, inpainting)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "stable-audio-3 @ git+https://github.com/Stability-AI/stable-audio-3@77e0398c26f7d22d801ec1bb036307e8b231f741",
  "torch==2.7.1",
  "torchaudio==2.7.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "soundfile>=0.13",
  "numpy>=2.2",
  "huggingface-hub>=1.7",
  # Prebuilt Flash Attention 2 for Windows (Stable Audio 3 Medium needs it; the small models do not).
  "flash-attn @ https://huggingface.co/lldacing/flash-attention-windows-wheel/resolve/main/flash_attn-2.7.4.post1%2Bcu128torch2.7.0cxx11abiFALSE-cp312-cp312-win_amd64.whl ; sys_platform == 'win32'",
  "flash-attn @ https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.4.10/flash_attn-2.8.2+cu128torch2.7-cp312-cp312-linux_x86_64.whl ; sys_platform == 'linux'",
]

[project.scripts]
sa3-server = "sa3_server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sa3_server"]

# CUDA builds of torch: plain PyPI ships CPU-only wheels on Windows.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
